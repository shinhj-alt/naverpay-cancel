name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies (브라우저 제외)
        run: npm install
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'

      - name: Download portable Node.js
        shell: pwsh
        run: |
          $nodeVer = "v20.18.3"
          Write-Host "Downloading Node.js $nodeVer portable..."
          Invoke-WebRequest `
            -Uri "https://nodejs.org/dist/$nodeVer/win-x64/node.exe" `
            -OutFile "node.exe"
          Write-Host "Done. Size: $((Get-Item node.exe).Length / 1MB -as [int]) MB"

      - name: Build release ZIP
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}"
          $folderName = "naverpay-cancel-$version"
          $zipName    = "$folderName-windows.zip"

          New-Item -ItemType Directory -Force -Path $folderName | Out-Null

          # 소스 파일
          Copy-Item "index.js", "install-browser.js", "package.json", "package-lock.json", "README.md" `
            -Destination "$folderName/"

          # public 폴더
          Copy-Item "public" -Destination "$folderName/public" -Recurse

          # node_modules (브라우저 바이너리 제외)
          Copy-Item "node_modules" -Destination "$folderName/node_modules" -Recurse

          # node.exe (포터블)
          Copy-Item "node.exe" -Destination "$folderName/node.exe"

          # start.bat — 포터블 node.exe 우선 사용
          $bat = '@echo off
chcp 65001 >nul
cd /d "%~dp0"
echo.
echo =========================================
echo   네이버페이 취소요청 자동처리 UI
echo =========================================
echo.
echo  서버를 시작합니다...  (이 창을 닫으면 종료됩니다)
echo.
"%~dp0node.exe" "%~dp0index.js"
echo.
echo 서버가 종료되었습니다.
pause'
          Set-Content -Path "$folderName/start.bat" -Value $bat -Encoding UTF8

          # ZIP 압축
          Compress-Archive -Path "$folderName" -DestinationPath $zipName -CompressionLevel Optimal
          Write-Host "Created $zipName ($([math]::Round((Get-Item $zipName).Length/1MB,1)) MB)"
          echo "ZIP_NAME=$zipName" >> $env:GITHUB_ENV
          echo "VERSION=$version" >> $env:GITHUB_ENV

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "네이버페이 취소처리 ${{ env.VERSION }}"
          files: ${{ env.ZIP_NAME }}
          body: |
            ## 🚀 설치 없이 바로 사용 (Windows)

            ### 다운로드 & 실행
            1. 아래 `.zip` 파일 다운로드 후 원하는 폴더에 압축 해제
            2. `start.bat` 더블클릭
            3. 자동으로 열리는 브라우저에서 사용

            > ✅ Node.js 별도 설치 불필요 — node.exe가 함께 포함되어 있습니다.
            > ✅ Chrome이 설치되어 있어야 합니다 (자동화에 사용).

            ### Chrome이 없는 경우
            압축 해제 폴더에서 아래 명령어 실행:
            ```
            node install-browser.js
            ```
