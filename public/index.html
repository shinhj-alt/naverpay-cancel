<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>네이버페이 취소 완료처리</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Malgun Gothic", sans-serif;
      background: #f0f0f0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 40px 16px 60px;
      color: #222;
    }
    .card {
      background: #fff;
      border-radius: 18px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.10);
      width: 100%;
      max-width: 420px;
      overflow: hidden;
    }
    .card-header {
      background: #03c75a;
      padding: 26px 24px 22px;
      color: #fff;
    }
    .card-header h1 { font-size: 1.25em; font-weight: 700; margin-bottom: 5px; }
    .card-header p  { font-size: 0.84em; opacity: 0.92; line-height: 1.5; }
    .card-body { padding: 22px 22px 26px; }

    /* 세션 바 */
    .session-bar {
      display: flex; align-items: center; gap: 8px;
      background: #f6f6f6; border-radius: 10px;
      padding: 10px 14px; margin-bottom: 22px;
    }
    .dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; background: #ccc; }
    .dot.on  { background: #03c75a; }
    .session-text { flex: 1; font-size: 0.83em; color: #444; }
    .btn-logout {
      padding: 4px 13px; font-size: 0.8em;
      background: #fff; border: 1px solid #ddd; border-radius: 7px;
      color: #666; cursor: pointer;
    }
    .btn-logout:hover { background: #f5f5f5; }

    /* 날짜 필터 */
    .section-label {
      font-size: 0.82em; color: #999; font-weight: 600;
      letter-spacing: 0.04em; margin-bottom: 14px;
    }
    .filter-group { margin-bottom: 14px; }
    .filter-label { font-size: 0.9em; font-weight: 600; color: #333; margin-bottom: 8px; }

    .date-row { display: flex; align-items: center; gap: 6px; }

    /* 날짜 입력 묶음 (월·일 + 시:분) */
    .dt-box {
      flex: 1; min-width: 0;
      display: flex; align-items: center; gap: 3px;
      background: #fafafa; border: 1px solid #e2e2e2; border-radius: 9px;
      padding: 6px 9px;
      transition: border-color 0.15s;
    }
    .dt-box:focus-within { border-color: #03c75a; background: #fff; }

    .dt-box input[type=number] {
      border: none; outline: none; background: transparent;
      font-size: 0.88em; color: #333; text-align: center;
      -moz-appearance: textfield;
      padding: 0;
    }
    .dt-box input[type=number]::-webkit-inner-spin-button,
    .dt-box input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; }
    .dt-box input.i-month { width: 26px; }
    .dt-box input.i-day   { width: 26px; }
    .dt-box input[type=time] {
      border: none; outline: none; background: transparent;
      font-size: 0.88em; color: #333; padding: 0; width: 58px;
    }
    .dt-unit { font-size: 0.8em; color: #aaa; flex-shrink: 0; }
    .dt-sep-inner { color: #ddd; font-size: 0.8em; margin: 0 2px; }

    .date-sep { color: #bbb; font-size: 0.95em; flex-shrink: 0; }

    .hint {
      font-size: 0.78em; color: #bbb;
      margin: 16px 0 18px; line-height: 1.6;
    }
    .dry-run-wrap {
      display: flex; align-items: center; gap: 7px;
      margin-bottom: 18px; cursor: pointer;
    }
    .dry-run-wrap input[type=checkbox] {
      width: 16px; height: 16px; accent-color: #03c75a; cursor: pointer;
    }
    .dry-run-wrap span { font-size: 0.85em; color: #666; user-select: none; }

    .btn-run {
      width: 100%; padding: 15px;
      background: #03c75a; color: #fff; border: none; border-radius: 11px;
      font-size: 1.05em; font-weight: 700; cursor: pointer;
      letter-spacing: 0.05em; transition: background 0.15s;
    }
    .btn-run:hover    { background: #02b34f; }
    .btn-run:disabled { background: #b0b0b0; cursor: not-allowed; }

    /* 로그 */
    .log-wrap { margin-top: 20px; }
    .status-line {
      font-size: 0.83em; color: #aaa; text-align: center;
      margin-bottom: 8px; min-height: 18px;
    }
    .status-line.running { color: #f57c00; }
    .status-line.done    { color: #03c75a; font-weight: 600; }
    .status-line.error   { color: #e53935; }
    #log {
      background: #1a1a1a; color: #d4d4d4;
      border-radius: 11px; padding: 14px;
      font-family: Consolas, "Cascadia Code", "Courier New", monospace;
      font-size: 0.79em; height: 260px; overflow-y: auto;
      white-space: pre-wrap; line-height: 1.55;
      display: none;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="card-header">
      <h1>네이버페이 취소 완료처리</h1>
      <p>날짜 조건을 설정하고 실행하면 자동으로 처리됩니다.</p>
    </div>
    <div class="card-body">

      <div class="session-bar">
        <div class="dot" id="sessionDot"></div>
        <span class="session-text" id="sessionText">세션 확인 중...</span>
        <button class="btn-logout" id="logoutBtn" style="display:none" onclick="logout()">로그아웃</button>
      </div>

      <form id="form">
        <div class="section-label">날짜 필터</div>

        <div class="filter-group">
          <div class="filter-label">취소요청일 — 이 시각까지의 건만 처리</div>
          <div style="display:flex; align-items:center; gap:8px;">
            <div class="dt-box" style="flex:1;">
              <input type="number" class="i-month" placeholder="MM" min="1" max="12" id="reqTo_m">
              <span class="dt-unit">월</span>
              <span class="dt-sep-inner">·</span>
              <input type="number" class="i-day" placeholder="DD" min="1" max="31" id="reqTo_d">
              <span class="dt-unit">일</span>
              <span class="dt-sep-inner">·</span>
              <input type="time" step="60" id="reqTo_t">
            </div>
            <button type="button" id="clearBtn" onclick="clearDate()" style="padding:8px 14px; background:#f0f0f0; border:1px solid #ddd; border-radius:9px; font-size:0.85em; color:#666; cursor:pointer; white-space:nowrap; flex-shrink:0;">비우기</button>
          </div>
        </div>

        <p class="hint">※ 비워두면 취소요청 전체를 처리합니다.</p>

        <label class="dry-run-wrap">
          <input type="checkbox" id="dryRun">
          <span>DRY RUN — 실제 처리 없이 매칭만 확인</span>
        </label>

        <button type="submit" class="btn-run" id="runBtn">실행</button>
      </form>

      <div class="log-wrap">
        <div class="status-line" id="statusLine"></div>
        <pre id="log"></pre>
      </div>
    </div>
  </div>

  <script>
    const logEl   = document.getElementById('log');
    const runBtn  = document.getElementById('runBtn');
    const statusEl = document.getElementById('statusLine');
    const YEAR = new Date().getFullYear();

    // ── 월/일/시간 → ISO datetime 문자열 변환 ──────────────
    function buildDatetime(mId, dId, tId) {
      const m = document.getElementById(mId).value.trim();
      const d = document.getElementById(dId).value.trim();
      const t = document.getElementById(tId).value.trim();  // "HH:mm" or ""
      if (!m || !d) return null;
      const mm = String(m).padStart(2, '0');
      const dd = String(d).padStart(2, '0');
      const [hh, mn] = t ? t.split(':') : ['00', '00'];
      return `${YEAR}-${mm}-${dd}T${hh}:${mn}`;
    }

    // ── 세션 상태 ──────────────────────────────────────────
    async function checkSession() {
      try {
        const r = await fetch('/session');
        const { hasProfile } = await r.json();
        const dot  = document.getElementById('sessionDot');
        const text = document.getElementById('sessionText');
        const btn  = document.getElementById('logoutBtn');
        if (hasProfile) {
          dot.className = 'dot on';
          text.textContent = '로그인 세션 저장됨 — 자동 로그인됩니다';
          btn.style.display = '';
        } else {
          dot.className = 'dot';
          text.textContent = '저장된 세션 없음 — 실행 시 로그인 필요';
          btn.style.display = 'none';
        }
      } catch {
        document.getElementById('sessionText').textContent = '서버 연결 오류';
      }
    }

    async function logout() {
      if (!confirm('저장된 세션을 삭제합니다.\n다음 실행 시 다시 로그인이 필요합니다.')) return;
      await fetch('/clear-session', { method: 'POST' });
      checkSession();
    }

    checkSession();

    function clearDate() {
      document.getElementById('reqTo_m').value = '';
      document.getElementById('reqTo_d').value = '';
      document.getElementById('reqTo_t').value = '';
    }

    // ── 폼 제출 ────────────────────────────────────────────
    function setStatus(text, cls) {
      statusEl.textContent = text;
      statusEl.className = 'status-line ' + (cls || '');
    }

    document.getElementById('form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const data = {
        payFrom: null,
        payTo:   null,
        reqFrom: null,
        reqTo:   buildDatetime('reqTo_m', 'reqTo_d', 'reqTo_t'),
        dryRun:  document.getElementById('dryRun').checked,
      };

      runBtn.disabled = true;
      logEl.textContent = '';
      logEl.style.display = 'block';
      setStatus('실행 중...', 'running');

      let resp;
      try {
        resp = await fetch('/run', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(data),
        });
      } catch (err) {
        setStatus('서버 연결 실패: ' + err.message, 'error');
        runBtn.disabled = false;
        return;
      }

      if (!resp.ok) {
        const txt = await resp.text();
        try { setStatus(JSON.parse(txt).error || txt, 'error'); }
        catch { setStatus(txt, 'error'); }
        runBtn.disabled = false;
        return;
      }

      const { id } = await resp.json();
      let lastLen = 0;

      const poll = async () => {
        try {
          const r = await fetch('/status?id=' + id);
          if (r.ok) {
            const s = await r.json();
            if (s.logs && s.logs.length > lastLen) {
              for (let i = lastLen; i < s.logs.length; i++) {
                logEl.textContent += s.logs[i] + '\n';
              }
              lastLen = s.logs.length;
              logEl.scrollTop = logEl.scrollHeight;
            }
            if (s.done) {
              setStatus(s.error ? '오류: ' + s.error : '완료!', s.error ? 'error' : 'done');
              runBtn.disabled = false;
              checkSession();
              return;
            }
          }
        } catch { /* 재시도 */ }
        setTimeout(poll, 500);
      };
      poll();
    });
  </script>
</body>
</html>
